[project]
name = "globex-agent"
version = "1.0.0"
description = "AgentScope 2.0 commerce concierge with DDD boundaries"
requires-python = ">=3.11,<3.13"
dependencies = [
  "agentscope==2.0.9", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1", "aiosqlite>=0.20,<1", "redis>=5.2,<7",
  "qdrant-client>=1.14,<2", "httpx>=0.28,<0.29", "pydantic-settings>=2.7,<3"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.uv]
package = false
